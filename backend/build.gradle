plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Compatible security patches beyond the Spring Boot 4.1.1 defaults.
ext['jackson-bom.version'] = '3.1.7'
ext['tomcat.version'] = '11.0.25'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('flywayRepair', JavaExec) {
	group = 'database'
	description = 'Explicitly repair Flyway history after verifying the applied schema matches the migrations.'
	classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.ghostpay.maintenance.FlywayRepair'
}

// Export resolved versions, rather than guessing from declared dependencies.
tasks.register('exportRuntimeDependencies') {
    group = 'verification'
    description = 'Export Maven runtime coordinates for scripts/audit-runtime-dependencies.py.'
    doLast {
        def queries = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [package: [ecosystem: 'Maven', name: it.moduleVersion.id.group + ':' + it.name], version: it.moduleVersion.id.version]
        }.unique()
        def output = layout.buildDirectory.file('reports/runtime-dependencies-osv.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson([queries: queries])
        println "Exported ${queries.size()} runtime coordinates to ${output}"
    }
}
